<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Paused state: same pouch as icon.svg, desaturated, smoke cleared. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3a3a8"/>
      <stop offset="1" stop-color="#5e5e64"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- Last wisp of smoke -->
  <path d="M64 56 C 56 48, 72 42, 64 32 C 58 25, 66 20, 70 22"
        fill="none" stroke="#8a8a92" stroke-width="5" stroke-linecap="round"/>

  <!-- Pouch: flared mouth, cinched neck, round body -->
  <path d="M48 70 C 42 64, 47 60, 54 63 L 74 63 C 81 60, 86 64, 80 70 Z"
        fill="#7a7a80"/>
  <path d="M55 78 C 30 86, 30 116, 64 116 C 98 116, 98 86, 73 78 Z"
        fill="url(#pouch)"/>
  <rect x="50" y="69" width="28" height="10" rx="5" fill="#3c3c42"/>
  <!-- Drawstring tail -->
  <path d="M74 75 C 84 80, 86 88, 82 94" fill="none"
        stroke="#3c3c42" stroke-width="4" stroke-linecap="round"/>
</svg>
